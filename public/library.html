<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — IQ2SAVE</title>
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="/">
        <img src="/assets/mark.svg" alt="" width="30" height="30">
        <span>IQ2SAVE<small data-i18n="brand.tagline">Your Links. Your Media.</small></span>
      </a>
      <div class="nav-links">
        <a href="/" data-i18n="nav.home">Home</a>
        <a href="/library" data-i18n="nav.library">Library</a>
        <a href="/settings" data-i18n="nav.settings">Settings</a>
      </div>
      <div class="nav-actions">
        <select class="lang-select" data-lang-select aria-label="Language" data-i18n-aria-label="nav.language"></select>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
        <button class="icon-btn hamburger" type="button" id="nav-toggle" aria-expanded="false" aria-controls="drawer" aria-label="Menu" data-i18n-aria-label="nav.menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
        </button>
      </div>
    </nav>
  </div>
</header>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="drawer-head">
    <strong>IQ2SAVE</strong>
    <button class="icon-btn" type="button" id="drawer-close" aria-label="Close" data-i18n-aria-label="nav.close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
    </button>
  </div>
  <a href="/" data-i18n="nav.home">Home</a>
  <a href="/library" data-i18n="nav.library">Library</a>
  <a href="/settings" data-i18n="nav.settings">Settings</a>
</aside>

<main id="main" class="wrap">
  <section class="section">
    <div class="section-head">
      <h1 data-i18n="library.title">Library</h1>
      <p data-i18n="library.subtitle">Everything this device has downloaded.</p>
    </div>

    <div class="card grid-3 stat-grid" id="library-stats"></div>

    <div class="filter-bar" id="library-filters"></div>

    <div class="grid grid-2 tools-row">
      <button class="btn btn-ghost" type="button" id="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        <span data-i18n="library.refresh">Refresh</span>
      </button>
      <button class="btn btn-ghost" type="button" id="clear-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
        <span data-i18n="library.clear">Clear history</span>
      </button>
    </div>

    <div class="card" id="library-list" aria-live="polite"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span data-i18n="footer.rights">Runs on your own device.</span>
      <span data-i18n="footer.reminder">Download only what you own or are allowed to save.</span>
    </div>
  </div>
</footer>

<script type="module" src="/js/library.js"></script>
</body>
</html>
